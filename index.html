<!doctype html>
<html lang="zh-CN" data-bg="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070707" />
<meta name="color-scheme" content="dark light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
<title>Cylinder Scroll · 百年孤独</title>
</head>
<body>
<div class="stage">
  <div class="overscroll-bg" aria-hidden="true"><span>Overscroll</span><span>Overscroll</span></div>
  <div class="scroll-sheet" id="scroll-sheet">
    <canvas id="c" aria-label="纵向滚动的圆柱画廊，内容取自百年孤独"></canvas>
  </div>
</div>
<p id="fallback" hidden>需要 WebGL2 才能运行此演示。</p>
<div class="bg-switch" role="group" aria-label="背景模式">
  <button type="button" data-bg="dark" aria-pressed="true">深色</button>
  <button type="button" data-bg="light" aria-pressed="false">浅色</button>
  <button type="button" data-bg="color" aria-pressed="false">彩色</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
